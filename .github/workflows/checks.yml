name: Site checks

# Runs tools/check_all.sh on GitHub's machines, so nobody needs Python or a
# browser installed to know whether a change broke something.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      states:
        description: 'Also hover every link and open every accordion (slower)'
        type: boolean
        default: true
  schedule:
    # Monday 06:00 UTC, with the interactive pass, so a slow drift in the
    # hover states gets noticed without anyone remembering to look.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      # Cache the browser: the download is most of the run time.
      - id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tools/requirements.txt') }}

      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # The system libraries are not cached with the browser binary.
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run the checks
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.states }}" = "true" ]; then
            tools/check_all.sh --states
          else
            tools/check_all.sh
          fi
